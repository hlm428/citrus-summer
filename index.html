<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="《柑橘味的夏天》系列官网——雨中分伞、便利店汽水、河边碰杯和一张写着「明天见」的纸条。两集在线看。" />
    <title>柑橘味的夏天 · 系列官网</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 顶部：系列名 + 一句话介绍 -->
    <header class="hero">
      <div class="heroTag">夏 · 短片系列</div>
      <h1>柑橘味的夏天</h1>
      <p class="heroIntro" id="seriesIntro"></p>
      <div class="heroBubbles"><span></span><span></span><span></span></div>
    </header>

    <!-- 两集封面 → 播放 -->
    <main>
      <section class="section">
        <h2 class="secTitle">在线观看</h2>
        <div id="epCards" class="epCards"></div>
      </section>

      <!-- 播放器（点封面展开） -->
      <section id="player" class="section player" hidden>
        <div class="playerHead">
          <h2 id="playerTitle"></h2>
          <button id="playerClose" class="closeBtn" title="收起播放器">收起 ✕</button>
        </div>
        <div class="videoWrap">
          <video id="video" controls playsinline preload="metadata"></video>
          <div id="videoFallback" class="videoFallback" hidden>
            <div class="fbEmoji">🍊</div>
            <p>这集的视频还没放进网站的 <code>videos/</code> 文件夹。</p>
            <p class="fbHint">把成片命名为 <code id="fbName"></code> 放进去，刷新就能看。</p>
          </div>
        </div>

        <h3 class="subTitle">分镜剧情 · 每段 10 秒</h3>
        <div id="sceneList" class="sceneList"></div>

        <h3 class="subTitle">旁白 · 日语 + 中文字幕</h3>
        <ol id="narrList" class="narrList"></ol>
      </section>

      <!-- 角色卡 -->
      <section class="section">
        <h2 class="secTitle">角色卡</h2>
        <div id="charCards" class="charCards"></div>
      </section>

      <!-- 幕后 -->
      <section class="section">
        <h2 class="secTitle">幕后 · 这两集是怎么做出来的</h2>
        <div id="making" class="making"></div>
        <p class="makingNote">全片画面由 AI 视频模型生成（10 秒一段 × 6 段拼成 60 秒），旁白为日语配音 + 中文字幕。</p>
      </section>

      <!-- 第三集占位 -->
      <section class="section">
        <div class="nextEp">
          <div class="nextEpBadge">第三集 · 制作中</div>
          <p>汽水还没喝完，夏天也还没结束——请期待。</p>
        </div>
      </section>
    </main>

    <footer class="foot">柑橘味的夏天 · AI 短片系列 · 画面由 AI 生成，非实拍</footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
